<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Park Day Owner Dashboard</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<script src="/vendor/leaflet/leaflet.js"></script>
<style>
:root{color-scheme:dark;--bg:#0B1E2E;--bg2:#12314A;--card:#143651;--card2:#19405F;--line:#24506f;--ink:#F3FAFB;--muted:#9FC4CF;--teal:#1FB8B4;--sun:#FFC933;--pink:#FF4F9A;--ok:#5BE39A;
 --body:"Nunito","Segoe UI",system-ui,sans-serif;--display:"Lilita One","Arial Black",Impact,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#12314A,#0B1E2E);color:var(--ink);font:600 15px var(--body);min-height:100vh}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1{font:400 30px var(--display);margin:4px 0 2px}h1 span{color:var(--sun)}
h2{font:400 21px var(--display);margin:24px 0 8px}
.sub{color:var(--muted);font:700 13px var(--body);margin:0 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
input,select{background:#0d2536;border:1px solid var(--line);color:var(--ink);border-radius:12px;padding:11px 12px;font:700 15px var(--body);min-width:0}
input{flex:1}
button{appearance:none;border:0;border-radius:12px;padding:11px 14px;font:900 14px var(--body);background:var(--teal);color:#fff;cursor:pointer}
button.ghost{background:transparent;border:2px solid var(--line);color:var(--ink)}
button.sun{background:var(--sun);color:var(--bg)}
button.danger{background:transparent;border:2px solid #7a2e4a;color:#ff9fc4}
button:disabled{opacity:.5}
.muted{color:var(--muted)}.err{color:#ff9fc4;font-weight:800}
.mod{display:grid;gap:10px}
.mod .name{font:900 17px var(--body)}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font:900 12px var(--body);background:var(--card2);color:var(--muted)}
.pill.on{background:rgba(91,227,154,.15);color:var(--ok)}.pill.off{background:rgba(255,79,154,.12);color:#ff9fc4}
.perms{display:grid;gap:10px}
.perms fieldset{border:1px solid var(--line);border-radius:12px;padding:6px 12px 8px;margin:0}
.perms legend{font:900 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--sun);padding:0 6px}
.perms label{display:flex;gap:10px;align-items:flex-start;font:700 14px var(--body);padding:6px 0;cursor:pointer}
.perms label span{display:grid;gap:2px}.perms small{color:var(--muted);font:600 12px var(--body)}
.perms input{flex:none;width:20px;height:20px;margin-top:1px;accent-color:var(--sun)}
button.small{padding:7px 11px;font-size:13px}.small{font-size:13px}p.small{margin:0}
.code{background:#0d2536;border:2px solid var(--sun);border-radius:14px;padding:12px;margin:10px 0}
.code b.v{font:400 26px var(--display);letter-spacing:.06em;color:var(--sun)}
.log td{vertical-align:top}.log td.t{white-space:nowrap;color:var(--muted)}.log td.w{white-space:nowrap}.log tr.bad td{color:#ff9fc4}.log tr.obs td{color:var(--muted)}
.logwrap{max-height:70vh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:0 8px}
.vtabs{display:flex;gap:6px;margin:6px 0 4px;flex-wrap:wrap}.vtabs button{background:transparent;border:2px solid var(--line);color:var(--ink)}.vtabs button.on{background:var(--sun);color:var(--bg);border-color:var(--sun)}
body.wide main{max-width:980px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 12px}.grid2 label{display:grid;gap:4px;font:800 13px var(--body);color:var(--muted)}
.grid2 label.chk{display:flex;align-items:center;gap:8px;color:var(--ink)}.grid2 label.chk input{flex:none;width:20px;height:20px;accent-color:var(--sun)}
.ok{color:var(--ok)}.warn{color:#ff9fc4}.dim{color:var(--muted)}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;word-break:break-all;background:#0d2536;border-radius:10px;padding:8px 10px}
.parks{display:grid;gap:6px}.parks .prow{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--card2);border-radius:12px;padding:8px 10px}
.lands{display:flex;flex-wrap:wrap;gap:6px}.lands .ld{display:inline-flex;gap:6px;align-items:center;border-radius:999px;padding:4px 6px 4px 10px;font:800 13px var(--body);color:#0B1E2E}
.lands .ld button{padding:2px 7px;border-radius:999px;background:rgba(0,0,0,.25);color:#fff;font-size:12px}
.mapwrap{background:#0d2536;border-radius:14px;overflow:hidden}
#lmap{isolation:isolate;height:60vh;min-height:320px;max-height:720px;background:#dfe7ea;font:700 13px var(--body)}
@media (min-width:900px){body.wide #lmap{height:640px}}
#lmap.tap-any{cursor:crosshair}
.ocard{margin-top:8px;display:grid;gap:8px}.ocard select{width:100%}.ocard .row{flex-wrap:wrap;gap:6px}.ostat{font:700 13px var(--body)}
.ostat b{color:#ffd166}
.ocorner{background:#FF4F9A;border:3px solid #fff;border-radius:50%;box-shadow:0 1px 4px #0008;cursor:grab}
.orow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.orow .push{margin-left:auto}
#lmap .leaflet-control-layers{font:800 13px var(--body);border-radius:10px}
#lmap .leaflet-control-layers label{padding:2px 0}
.splabel{font:800 12px var(--body);padding:2px 6px;border-radius:8px;border:0;box-shadow:0 1px 4px rgba(0,0,0,.4);color:#0B1E2E}
.maphint{margin:6px 0 0}
.vtabs.sub{margin:14px 0 4px}.vtabs.sub button{padding:9px 12px;font-size:13px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:6px;margin-bottom:8px}
.modes button{background:transparent;border:2px solid var(--line);color:var(--ink);padding:10px 8px;font-size:14px}
.modes button.on{background:var(--teal);border-color:var(--teal);color:#fff}
.paintl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 8px}
.paintl button{padding:6px 10px;font-size:13px;border-radius:999px;background:transparent;border:2px solid var(--c);color:var(--ink)}
.paintl button.on{background:var(--c);color:#0B1E2E}
.savebar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;padding:8px 10px;border-radius:12px;background:#0d2536;position:sticky;bottom:8px;z-index:500}
.savebar.need{outline:2px solid var(--sun)}
.spots{max-height:55vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.spots td select{padding:6px 8px;font-size:13px;border-radius:8px;max-width:190px}.spots tr.sel td{background:rgba(255,201,51,.12)}
.legend{display:flex;flex-wrap:wrap;gap:4px 10px;font:800 12px var(--body)}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:middle}
table{width:100%;border-collapse:collapse;font:700 13px var(--body)}td,th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}th{color:var(--muted)}
</style></head>
<body><main>
<div class="row between"><h1>Park <span>Day</span> Owner Dashboard</h1><button class="ghost small" id="topout" hidden>Sign out</button></div>
<p class="sub">Who can help run the stream, what each person may do, a log of who pressed what, and the Location scene. Mods sign in to the planner app with their own code.</p>
<div id="app"></div>
</main>
<script>
const KEY = "parkday-admin-code";
// roles and permissions come from the server (/api/perms), so this page always matches the app
let ROLES = {}, PERMS = [];
const loadPerms = () => fetch("/api/perms").then(r => r.json()).then(j => { ROLES = { ...j.roles, custom: { label: "Custom", perms: null, what: "your own mix" } }; PERMS = j.perms; });
const open = new Set();   // cards with the permission list expanded
const $ = s => document.querySelector(s), app = $("#app");
const esc = t => String(t ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let code = ""; try { code = localStorage.getItem(KEY) || ""; } catch (e) {}
let mods = [], shown = null, err = "";
async function api(path, opts = {}) {
  const r = await fetch(path, { ...opts, headers: { "content-type": "application/json", authorization: "Bearer " + code } });
  if (r.status === 401) { const e = new Error("That code didn't work."); e.auth = true; throw e; }
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || "Server said " + r.status);
  return j;
}
const WORDS = ["TEACUP", "MONORAIL", "CASTLE", "SKYLINER", "DUMBO", "FIGMENT", "GOOFY", "PLUTO", "EPCOT", "TIKI", "ORBIT", "PIXAR", "CHURRO", "LANTERN", "PARADE", "COMET",
  "GALAXY", "HARBOR", "JUNGLE", "KETTLE", "LAGOON", "MAGNET", "NEBULA", "OCEAN", "PEBBLE", "QUILL", "ROCKET", "SAILOR", "TROLLEY", "UNICORN", "VOYAGE", "WAFFLE",
  "YONDER", "ZEPHYR", "ANCHOR", "BALLOON", "CANYON", "DRAGON", "EMBER", "FALCON", "GLACIER", "HOPPER", "ISLAND", "JASPER", "KAZOO", "LOCKET", "MARBLE", "NUTMEG",
  "OTTER", "PEPPER", "RIPPLE", "SPROCKET", "TOUCAN", "VELVET", "WHISTLE", "BISCUIT", "CRICKET", "DOODLE", "GADGET", "PRETZEL", "SPARKLER", "TWISTER", "WIDGET", "ZIPLINE"];
// 3 random words + 4 digits: about 2 billion possible codes (and 10 wrong tries locks the guesser out)
const newCode = () => { const b = new Uint32Array(4); crypto.getRandomValues(b); return [0, 1, 2].map(i => WORDS[b[i] % WORDS.length]).join("-") + "-" + (1000 + (b[3] % 9000)); };
const uid = () => Math.random().toString(36).slice(2, 10);
function signOut() { try { localStorage.removeItem(KEY); } catch (x) {} code = ""; mods = []; shown = null; login(); }
function login(msg) {
  $("#topout").hidden = true;
  app.innerHTML = `<div class="card"><p><b>Sign in</b></p><p class="muted">Use the owner dashboard code (not your planner passcode, not a mod code).</p>
    <form id="f" class="row"><input id="c" type="password" autocomplete="current-password" placeholder="Owner dashboard code"><button>Sign in</button></form>${msg ? `<p class="err">${esc(msg)}</p>` : ""}</div>`;
  $("#f").onsubmit = async e => { e.preventDefault(); code = $("#c").value.trim(); try { const w = await api("/api/whoami"); if (w.role !== "admin" && w.role !== "owner") throw new Error("That code isn't the owner dashboard code."); try { localStorage.setItem(KEY, code); } catch (x) {} load(); } catch (x) { code = ""; login(x.message); } };
}
async function load() { try { if (!PERMS.length) await loadPerms(); mods = await api("/api/mods"); err = ""; } catch (e) { if (e.auth) { try { localStorage.removeItem(KEY); } catch (x) {} return login(e.message); } err = e.message; } render(); }
async function save(list, newShown) { try { mods = await api("/api/mods", { method: "PUT", body: JSON.stringify(list) }); shown = newShown || null; err = ""; } catch (e) { err = e.message; } render(); }
const key = l => JSON.stringify([...(l || [])].sort());
// the preset that matches these exact permissions, else Custom
const roleOf = m => (Object.entries(ROLES).find(([k, r]) => r.perms && key(r.perms) === key(m.perms)) || ["custom"])[0];
const groups = () => [...new Set(PERMS.map(p => p.g))];
function render() {
  app.innerHTML = `
    ${err ? `<p class="err">${esc(err)}</p>` : ""}
    ${shown ? `<div class="code">Code for <b>${esc(shown.name)}</b>: <b class="v">${esc(shown.code)}</b><br><span class="muted">Send it to them privately. It's shown only this once; make a new one any time.</span>
      <div class="row" style="margin-top:8px"><button class="sun" id="copy">Copy code</button><button class="ghost" id="hide">Hide</button></div></div>` : ""}
    <div class="vtabs">${[["mods", "Moderators"], ["act", "Activity"], ["loc", "Location"]].map(([k, l]) => `<button class="${view === k ? "on" : ""}" data-v="${k}">${l}</button>`).join("")}</div>
    <section data-v="mods">
    <h2>Add a moderator</h2>
    <div class="card"><form id="add" class="row"><input id="n" placeholder="Their name" maxlength="40">
      <select id="r">${Object.entries(ROLES).filter(([k]) => k !== "custom").map(([k, r]) => `<option value="${k}" ${k === "mod" ? "selected" : ""}>${r.label}: ${r.what}</option>`).join("")}</select>
      <button>+ Add</button></form></div>
    <h2>Moderators <span class="muted" style="font:700 14px var(--body)">${mods.length}</span></h2>
    ${mods.length ? "" : `<p class="muted">No moderators yet.</p>`}
    ${mods.map(m => { const r = roleOf(m), n = (m.perms || []).length, isOpen = open.has(m.id); return `
      <div class="card mod" data-id="${esc(m.id)}">
        <div class="row between"><span class="name">${esc(m.name)}</span><span class="pill ${m.active === false ? "off" : "on"}">${m.active === false ? "Turned off" : "Can sign in"}</span></div>
        <div class="row"><span class="muted">Role</span><select class="role">${Object.entries(ROLES).map(([k, x]) => `<option value="${k}" ${k === r ? "selected" : ""}>${x.label}</option>`).join("")}</select>
          <button class="ghost small more">${isOpen ? "Hide" : "Choose"} abilities (${n} of ${PERMS.length})</button></div>
        <p class="muted small">${esc(ROLES[r].what)}</p>
        ${isOpen ? `<div class="perms">${groups().map(g => `<fieldset><legend>${esc(g)}</legend>${PERMS.filter(p => p.g === g).map(p => `<label><input type="checkbox" class="perm" value="${p.k}" ${(m.perms || []).includes(p.k) ? "checked" : ""}><span><b>${esc(p.l)}</b><small>${esc(p.h)}</small></span></label>`).join("")}</fieldset>`).join("")}
          <div class="row"><button class="ghost small all">All</button><button class="ghost small none">None</button></div></div>` : ""}
        <div class="row"><button class="ghost toggle">${m.active === false ? "Turn on" : "Turn off"}</button><button class="ghost recode">New code</button><button class="danger remove">Remove</button></div>
      </div>`; }).join("")}
    </section>
    <section data-v="act">
    <h2>Activity <span class="muted" style="font:700 14px var(--body)">who pressed what</span></h2>
    <div class="card" id="act"></div>
    </section>
    <section data-v="loc"><div id="loc"></div></section>
    <p class="muted" style="margin-top:24px">Signed in to the owner dashboard. <button class="ghost" id="out">Sign out</button></p>`;
  if (shown) { $("#copy").onclick = () => { navigator.clipboard.writeText(shown.code).then(() => { $("#copy").textContent = "Copied"; }).catch(() => {}); }; $("#hide").onclick = () => { shown = null; render(); }; }
  $("#add").onsubmit = e => { e.preventDefault(); const name = $("#n").value.trim() || "Mod", role = $("#r").value, c = newCode(); save([...mods, { id: uid(), name, role, perms: ROLES[role].perms, active: true, code: c }], { name, code: c }); };
  $("#out").onclick = signOut;
  const top = $("#topout"); top.hidden = false; top.textContent = "Sign out"; delete top.dataset.sure;
  top.onclick = () => { if (top.dataset.sure) return signOut(); top.dataset.sure = "1"; top.textContent = "Tap again"; setTimeout(() => { if (top.dataset.sure) { delete top.dataset.sure; top.textContent = "Sign out"; } }, 3000); };
  renderLog();
  document.querySelectorAll(".vtabs button").forEach(b => b.onclick = () => { view = b.dataset.v; try { localStorage.setItem("parkday-admin-view", view); } catch (x) {} applyView(); });
  applyView();
  document.querySelectorAll(".mod").forEach(el => {
    const id = el.dataset.id, m = mods.find(x => x.id === id), put = fn => save(mods.map(x => x.id === id ? fn({ ...x }) : x));
    el.querySelector(".role").onchange = e => { const r = e.target.value; if (r === "custom") { open.add(id); render(); return; } put(x => { x.role = r; x.perms = ROLES[r].perms; return x; }); };
    el.querySelector(".more").onclick = () => { open.has(id) ? open.delete(id) : open.add(id); render(); };
    el.querySelectorAll(".perm").forEach(cb => cb.onchange = () => put(x => { const on = [...el.querySelectorAll(".perm")].filter(c => c.checked).map(c => c.value); x.perms = on; x.role = roleOf({ perms: on }); return x; }));
    const setAll = on => put(x => { x.perms = on ? PERMS.map(p => p.k) : []; x.role = roleOf(x); return x; });
    if (el.querySelector(".all")) { el.querySelector(".all").onclick = () => setAll(true); el.querySelector(".none").onclick = () => setAll(false); }
    el.querySelector(".toggle").onclick = () => put(x => { x.active = x.active === false; return x; });
    el.querySelector(".recode").onclick = () => { const c = newCode(); save(mods.map(x => x.id === id ? { ...x, code: c } : x), { name: m.name, code: c }); };
    el.querySelector(".remove").onclick = () => { if (el.dataset.sure) save(mods.filter(x => x.id !== id)); else { el.dataset.sure = "1"; el.querySelector(".remove").textContent = "Tap again to remove"; } };
  });
}
// Activity log: every change, stream button, mod change and lockout, kept 30 days by the server
let log = null, logDays = 1, logWho = "", logErr = "";
async function loadLog() {
  try { log = await api("/api/log?days=" + logDays); logErr = ""; } catch (e) { logErr = e.message; }
  renderLog();
}
const when = t => new Date(t).toLocaleString([], { month: "short", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit" });
function renderLog() {
  const box = $("#act"); if (!box) return;
  if (!log && !logErr) { box.innerHTML = `<p class="muted">Loading…</p>`; loadLog(); return; }
  const people = [...new Set((log || []).map(r => r.who))].sort();
  const rows = (log || []).filter(r => !logWho || r.who === logWho);
  box.innerHTML = `<div class="row">
      <select id="ld">${[[1, "Last 24 hours"], [7, "Last 7 days"], [30, "Last 30 days"]].map(([v, l]) => `<option value="${v}" ${v === logDays ? "selected" : ""}>${l}</option>`).join("")}</select>
      <select id="lw"><option value="">Everyone</option>${people.map(p => `<option ${p === logWho ? "selected" : ""}>${esc(p)}</option>`).join("")}</select>
      <button class="ghost small" id="lr">Refresh</button><button class="ghost small" id="lc" ${rows.length ? "" : "disabled"}>Download</button></div>
    ${logErr ? `<p class="err">${esc(logErr)}</p>` : ""}
    <p class="muted small" style="margin:8px 0">${rows.length} ${rows.length === 1 ? "entry" : "entries"}, newest first. Kept for 30 days.</p>
    ${rows.length ? `<div class="logwrap"><table class="log"><tr><th>When</th><th>Who</th><th>What</th></tr>${rows.map(r => `<tr class="${r.ok === 0 ? "bad" : r.kind === "obs" ? "obs" : ""}"><td class="t">${esc(when(r.at))}</td><td class="w">${esc(r.who)}</td><td>${esc(r.what)}</td></tr>`).join("")}</table></div>` : `<p class="muted">Nothing yet in this time range.</p>`}`;
  $("#ld").onchange = e => { logDays = +e.target.value; log = null; renderLog(); };
  $("#lw").onchange = e => { logWho = e.target.value; renderLog(); };
  $("#lr").onclick = () => loadLog();
  $("#lc").onclick = () => {
    const q = v => `"${String(v ?? "").replace(/"/g, '""')}"`;
    const csv = ["When,Who,Role,Kind,What,Worked", ...rows.map(r => [new Date(r.at).toLocaleString(), r.who, r.role, r.kind, r.what, r.ok === 1 ? "yes" : r.ok === 0 ? "no" : ""].map(q).join(","))].join("\r\n");
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], { type: "text/csv" }));
    a.download = "park-day-activity-" + new Date().toISOString().slice(0, 10) + ".csv";
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  };
}
let view = "mods"; try { view = localStorage.getItem("parkday-admin-view") || "mods"; } catch (x) {}
function applyView() {
  document.querySelectorAll("section[data-v]").forEach(s => { s.hidden = s.dataset.v !== view; });
  document.querySelectorAll(".vtabs button").forEach(b => b.classList.toggle("on", b.dataset.v === view));
  document.body.classList.toggle("wide", view === "loc");
  if (view === "loc") renderLoc();
}
// ---------------- Location tab: GPS from Moblin, the "location" scene, lands per park ----------------
const TP = "https://api.themeparks.wiki/v1";
const TYPES = { ATTRACTION: "A", SHOW: "S", RESTAURANT: "R" }, TYPE_L = { A: "Ride", S: "Show", R: "Food", H: "Shop", P: "Place", C: "Own spot" };
const COLORS = ["#1FB8B4", "#FF4F9A", "#FFC933", "#7A3CF0", "#5BE39A", "#FF7A1A", "#3B8FF0", "#E8384F", "#22B573", "#C026D3", "#0EA5E9", "#F59E0B", "#A3E635", "#F472B6", "#94A3B8", "#FDE68A"];
let L = { info: null, err: "", prefill: null, park: null, sel: null, mode: "pick", paint: "", test: null, newKey: "", filter: "", busy: "",
  sub: (() => { try { return localStorage.getItem("parkday-admin-locsub") || "map"; } catch (x) { return "map"; } })(),
  pick: (() => { try { return localStorage.getItem("parkday-admin-park") || ""; } catch (x) { return ""; } })() };
const savedPark = id => ((L.info && L.info.parks) || []).find(x => x.id === id);
// outside the parks: hotels, stations, docks and transport, kept like a park under these ids
const RESORTS = { "resort-wdw": "Outside the parks: Walt Disney World", "resort-uo": "Outside the parks: Universal Orlando", "resort-dlr": "Outside the parks: Disneyland Resort" };
const RESORT_NAME = { "resort-wdw": "Walt Disney World Resort", "resort-uo": "Universal Orlando Resort", "resort-dlr": "Disneyland Resort" };

  const setLand = (id, v, custom) => { if (custom) { const c = p.custom.find(x => x.id === id); if (c) c.land = v && v !== "-" ? v : null; } else if (v) p.assign[id] = v; else delete p.assign[id]; touch(); };
  document.querySelectorAll("select[data-as]").forEach(s => s.onchange = () => { setLand(s.dataset.as, s.value, !!s.dataset.c); renderLoc(); });
  document.querySelectorAll("[data-delc]").forEach(b => b.onclick = () => { p.custom = p.custom.filter(c => c.id !== b.dataset.delc); touch(); renderLoc(); });
  L.tap = async (at, id) => {
    if (L.mode === "pick") { if (!id) return; L.sel = id; L.filter = ""; renderLoc(); const row = document.getElementById("r-" + id); if (row) row.scrollIntoView({ block: "nearest" }); return; }
    if (L.mode === "outline") {
      if (L.draw) { if (L.draw.length >= 40) { L.err = "40 corners at most"; renderLoc(); return; } addCorner(at); return; }
      if (id && outlineSpots(p).find(x => x.id === id)) { L.oSel = id; renderLoc(); }
      return;
    }
    if (L.mode === "paint") { if (!id) return; setLand(id, L.paint, !!p.custom.find(c => c.id === id)); L.sel = id; renderLoc(); return; }
    if (L.mode === "test") {
      try {
        const r2 = await api("/api/location/test", { method: "POST", body: JSON.stringify(at) }); L.test = { ...r2, at };
        // test mode on: also "pretend I'm here", so the OBS location card shows it (while OBS is not streaming)
        if (L.info && L.info.test) {
          const r3 = await fetch("/api/location/phone", { method: "POST", headers: { "content-type": "application/json", authorization: "Bearer " + code }, body: JSON.stringify({ latitude: at.lat, longitude: at.lon, speed: 0, src: "map" }) });
          if (r3.ok) L.note = "Sent to test mode: the OBS location card shows this (tagged TEST) while OBS is not streaming."; else L.err = "Test mode: " + ((await r3.json().catch(() => ({}))).error || "server said " + r3.status);
          await locLoad();
        } else L.note = "Preview only. Start test mode (top of this page) and tap again to see it on the OBS location card.";
      } catch (er) { L.err = er.message; }
      renderLoc(); return;
    }
    if (L.mode === "pin") { const n = ($("#pinname").value || "").trim(); if (!n) { $("#pinname").focus(); $("#pinname").placeholder = "Type a name first, then tap the map"; return; } const nid = "c" + Math.random().toString(36).slice(2, 9); p.custom.push({ id: nid, n, t: L.pinType || (p.resort ? "P" : "R"), lat: +at.lat.toFixed(6), lon: +at.lon.toFixed(6), land: L.paint && L.paint !== "-" ? L.paint : null }); touch(); L.mode = "outline"; L.oSel = nid; L.draw = null; L.note = "Added " + n + ". Draw its outline now (✏️ Draw from scratch), or just tap Save to keep it as a spot."; renderLoc(); }
  };
  mountMap(p);
  $("#psave").onclick = savePark;
  // save history: earlier copies of this park, and going back to one (tap twice)
  if ($("#phist")) $("#phist").onclick = async () => { if (L.hist && L.hist.id === p.id) { L.hist = null; renderLoc(); return; } try { L.hist = { id: p.id, ...(await api("/api/location/history?id=" + encodeURIComponent(p.id))) }; } catch (e) { L.err = e.message; } renderLoc(); };
  if ($("#phclose")) $("#phclose").onclick = () => { L.hist = null; renderLoc(); };
  document.querySelectorAll("[data-goback]").forEach(b => b.onclick = async () => {
    if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Tap again to go back"; return; }
    const when = histWhen(Number(b.dataset.goback));
    try {
      if (p.dirty && !p.fresh) await putPark(p);   // what is on screen is saved first, so it is in History too
      await api("/api/location/restore?id=" + encodeURIComponent(p.id) + "&v=" + encodeURIComponent(b.dataset.goback), { method: "POST" });
      dropDraft(p.id); L.hist = null; await openPark(p.id); await locLoad();
      L.note = `Went back to the copy from ${when}. What you had before is now the first entry in History, so you can undo this.`;
    } catch (e) { L.err = e.message; }
    renderLoc();
  });
  if ($("#pdiscard")) $("#pdiscard").onclick = () => { const b = $("#pdiscard"); if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Tap again to throw away"; return; } p.dirty = false; L.draw = null; dropDraft(p.id); const keep = L.oSel, mode = L.mode; openPark(p.id).then(() => { L.oSel = keep; L.mode = mode; L.note = "Changes thrown away."; renderLoc(); }); };
  if ($("#prefresh")) $("#prefresh").onclick = async () => {
    L.busy = "Refreshing rides…"; renderLoc();
    try { const f = await fetchSpots(p.id); const keep = new Set(f.spots.map(s => s.id)); p.spots = f.spots; for (const k of Object.keys(p.assign)) if (!keep.has(k)) delete p.assign[k];
      const sug = ((await pf())[p.id] || {}).lands || {}, s2 = suggest(p.spots, sug); for (const s of p.spots) if (!p.assign[s.id] && s2[s.id] && p.lands.includes(s2[s.id])) p.assign[s.id] = s2[s.id]; touch(); L.note = "Rides refreshed. New spots got suggested lands."; }
    catch (e) { L.err = e.message; }
    L.busy = ""; renderLoc();
  };
  if ($("#premove")) $("#premove").onclick = async () => { const b = $("#premove"); if (!b.dataset.sure) { b.dataset.sure = 1; b.textContent = "Tap again to remove"; return; } try { await api("/api/location/park?id=" + encodeURIComponent(p.id), { method: "DELETE" }); } catch (e) { L.err = e.message; } L.park = null; await locLoad(); renderLoc(); };
}

code ? load() : login();
