<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Park Day Location</title>
<meta name="robots" content="noindex">
<!-- Credits: place names, hotels, districts and ride outlines © OpenStreetMap contributors, ODbL (openstreetmap.org/copyright). Round map: USGS The National Map, public domain. Ride and show data: ThemeParks.wiki. -->
<meta name="attribution" content="Map data © OpenStreetMap contributors (ODbL); USGS imagery, public domain; ThemeParks.wiki">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap">
<link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
<!--
  OBS browser source for the location card (1920 x 1080; vertical: 1080 x 1920 with &layout=vertical).
  URL: https://<app>/location?key=<OVERLAY_KEY>   options: &layout=vertical  &pos=bl|tl|tr|br  &preview=1 (used by the app)
  Shows park, land and the ride when close; resort hotels and areas; the town outside. Optional round map above the card (owner
  switch; shows the exact spot on USGS satellite or drawn maps, public domain, plus nearby ride names) and a "Heading to" line below it (what you typed in the app, else your NEXT stop).
  Top countdown to your ticked show, same look and same app controls as the Now scene. Listens for changes.
-->
<style>
  /* Same place, size and shape as the NOW/NEXT "ticket" card (overlay.html look=ticket), so switching scenes causes no layout shift:
     horizontal left 40 / bottom 44, vertical left 40 / right 40 / bottom 80; the "Heading to" row sits where the NEXT row does. */
  :root{--teal:#1FB8B4;--ink:#0E7F7C;--navy:#0B1E2E;--sun:#FFC933;--cream:#FFF8EC;--ring:#1FB8B4;--stub:132px;
    --display:"Lilita One","Arial Black",Impact,sans-serif;--body:"Nunito","Segoe UI",Arial,sans-serif}
  html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden}
  body{font-family:var(--body)}
  #stack{position:absolute;left:40px;bottom:44px;display:flex;flex-direction:column;align-items:flex-start;gap:16px;max-width:1000px;opacity:0;transform:translateY(24px);transition:opacity .45s ease,transform .45s ease}
  body.pos-tl #stack{top:84px;bottom:auto} body.pos-tr #stack{top:84px;bottom:auto;left:auto;right:40px;align-items:flex-end} body.pos-br #stack{left:auto;right:40px;align-items:flex-end}
  html.vertical{--stub:150px}
  html.vertical #stack{left:40px;right:40px;bottom:80px;max-width:none}
  #stack.on{opacity:1;transform:none}
  /* round map above the card */
  #mapbox{display:none;position:relative;width:300px;height:300px;margin-left:8px}
  html.vertical #mapbox{width:260px;height:260px}
  body.mapon #mapbox{display:block}
  #map{width:100%;height:100%;border-radius:50%;border:9px solid var(--ring);box-sizing:border-box;box-shadow:0 12px 30px rgba(0,0,0,.45);overflow:hidden;background:#dfe9e4}
  #map .leaflet-control-container{display:none}
  body.photo #map .leaflet-tile-pane{filter:brightness(1.18) contrast(1.05) saturate(1.2)}
  .lbl{font:900 14px var(--body);color:var(--navy);background:rgba(255,248,236,.92);padding:2px 8px;border-radius:9px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35);transform:translate(-50%,-140%);display:inline-block;max-width:200px;overflow:hidden;text-overflow:ellipsis}
  .me{width:26px;height:26px;border-radius:50%;background:var(--sun);border:5px solid var(--navy);box-shadow:0 0 0 6px rgba(255,201,51,.35);box-sizing:border-box}
  /* the card: row 1 = ticket (stub + text), row 2 = HEADING chip + text, like the NOW card's NEXT row */
  #card{position:relative;display:grid;grid-template-columns:var(--stub) minmax(0,auto);row-gap:12px;max-width:100%}
  html.vertical #card{width:100%;grid-template-columns:var(--stub) minmax(0,1fr)}
  #card::before{content:"";grid-area:1/1/2/3;background:var(--cream);border-radius:24px;box-shadow:0 12px 30px rgba(0,0,0,.45)}
  #stub{grid-area:1/1/2/2;z-index:1;min-height:var(--stub);background:var(--teal);border-radius:24px 0 0 24px;border-right:5px dashed var(--cream);display:flex;align-items:center;justify-content:center;box-sizing:border-box}
  #stub svg{width:74px;height:74px;fill:none;stroke:#fff;stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}
  html.vertical #stub svg{width:84px;height:84px}
  #txt{grid-area:1/2/2/3;z-index:1;padding:16px 30px 16px 26px;display:flex;flex-direction:column;justify-content:center;gap:2px;min-width:0;max-width:840px}
  html.vertical #txt{max-width:none}
  #label:empty{display:none}
  #label{font-weight:900;font-size:28px;line-height:1.1;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
  #main{font-family:var(--display);font-size:62px;line-height:1.04;color:var(--navy);overflow:hidden;overflow-wrap:anywhere}
  #sub{font-weight:900;font-size:27px;color:#557085;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  html.vertical #label{font-size:34px}
  #sub:empty{display:none}
  #testtag{display:none;position:absolute;top:-18px;right:18px;z-index:2;background:var(--sun);color:var(--navy);font:900 22px var(--body);letter-spacing:.06em;padding:4px 14px;border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,.35);white-space:nowrap}
  body.test #testtag{display:block}
  body.travel #stub{background:#6366F1} body.travel #label{color:#4338CA}
  body.resort #stub{background:#2E6FD8} body.resort #label{color:#1F4FA0}
  #hchip,#head{display:none}
  body.headon #hchip,body.headon #head{display:block}
  #hchip{grid-area:2/1/3/2;align-self:center;justify-self:stretch;margin:0 14px 0 0;font:400 23px var(--display);letter-spacing:.03em;line-height:1;text-align:center;padding:9px 4px 8px;box-sizing:border-box;border-radius:14px;background:var(--sun);color:var(--navy);box-shadow:0 6px 16px rgba(0,0,0,.4)}
  html.vertical #hchip{font-size:27px;padding:7px 4px 6px}
  #head{grid-area:2/2/3/3;justify-self:start;align-self:center;max-width:100%;box-sizing:border-box;background:rgba(11,30,46,.92);padding:8px 22px 6px;border-radius:14px;box-shadow:0 6px 16px rgba(0,0,0,.4)}
  #headtxt{display:block;font:400 34px var(--display);color:#fff;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* top countdown: same look, timing and controls as the Now scene (overlay.html): the app's Countdown On/Off, the
     "Show it" window and the ticked show. Top left; top right when the card itself sits top left. */
  #cd{position:absolute;left:44px;top:40px;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:3;
    transform:translateY(-160%);transition:transform .8s cubic-bezier(.2,1.3,.4,1)}
  #cd.show{transform:translateY(0)}
  #cd:not(.show){visibility:hidden;transition:transform .8s cubic-bezier(.2,1.3,.4,1),visibility 0s .8s}
  body.pos-tl #cd{left:auto;right:44px;align-items:flex-end}
  #cdLabel{font-family:var(--display);font-size:32px;color:#fff;background:#7A3CF0;
    padding:8px 18px 6px;border-radius:14px;border:4px solid #fff;-webkit-text-stroke:1px #2a0d5e;paint-order:stroke fill;
    box-shadow:0 6px 18px rgba(0,0,0,.4);max-width:760px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cdTime{font-family:var(--display);font-size:96px;line-height:1;color:#fff;
    background:linear-gradient(135deg,#FF4F9A,#7A3CF0);padding:10px 28px 4px;border-radius:22px;border:5px solid var(--teal);
    -webkit-text-stroke:3px #2a0d5e;paint-order:stroke fill;font-variant-numeric:tabular-nums;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  #cdTime small{font-size:40px;margin-left:6px}
  #cd.final #cdTime{animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #cd.live #cdTime{background:linear-gradient(135deg,#FF8A00,#FF4F9A);font-size:72px;padding:14px 28px 8px}
  html.vertical #cd{left:36px;right:auto;top:100px;align-items:flex-start}
  html.vertical body.pos-tl #cd,html.vertical body.pos-tr #cd{top:auto;bottom:80px}
  html.vertical #cdLabel{max-width:600px;font-size:36px}
  html.vertical #cdTime{font-size:110px}
  @media (prefers-reduced-motion:reduce){#cd,#cd *{animation:none!important;transition:none!important}}
  /* preview inside the app: dark backdrop and a status line */
  body.preview{background:#0B1E2E}
  #pv{display:none;position:absolute;left:70px;top:50px;right:70px;font:900 56px var(--body);color:#9FC4CF}
  body.preview #stack.empty{opacity:.55}
  body.preview #pv{display:block}
</style></head>
<body class="pos-bl">
<div id="pv">Connecting…</div>
<div id="cd"><div id="cdLabel"></div><div id="cdTime"></div></div>
<div id="stack">
  <div id="mapbox"><div id="map"></div></div>
  <div id="card"><div id="testtag">TEST</div>
    <div id="stub"><svg viewBox="0 0 24 24" id="ic"></svg></div>
    <div id="txt"><div id="label"></div><div id="main"></div><div id="sub"></div></div>
    <div id="hchip">HEADING</div><div id="head"><span id="headtxt"></span></div>
  </div>
</div>
<script src="/vendor/leaflet/leaflet.js"></script>
<script>
(function () {
  "use strict";
  var q = new URLSearchParams(location.search);
  var key = q.get("key") || "";
  var preview = q.get("preview") === "1";
  if (q.get("layout") === "vertical") document.documentElement.classList.add("vertical");
  var pos = q.get("pos"); document.body.className = "pos-" + (/^(bl|tl|tr|br)$/.test(pos || "") ? pos : "bl");
  if (preview) document.body.classList.add("preview");
  // keep the key out of the address bar and history
  try { var u = new URL(location.href); u.searchParams.delete("key"); history.replaceState(null, "", u.pathname + (u.search || "")); } catch (e) {}
  var $ = function (id) { return document.getElementById(id); };
  var B = document.body;
  var ICON = {
    pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.6"/>',
    ride: '<path d="M4 20h16M6 20V9l6-5 6 5v11"/><path d="M10 20v-5h4v5"/>',
    train: '<rect x="5" y="3" width="14" height="13" rx="3"/><path d="M5 10h14M8 19l-2 2M16 19l2 2"/><circle cx="9" cy="13" r=".8"/><circle cx="15" cy="13" r=".8"/>',
    hotel: '<path d="M3 20h18M5 20V8l7-4 7 4v12"/><path d="M9 20v-4h6v4M9 10h.01M12 10h.01M15 10h.01M9 13h.01M12 13h.01M15 13h.01"/>',
    town: '<path d="M3 20h18M5 20v-8l4-3 4 3v8M13 20V6l6 3v11"/>'
  };
  var RESORT = "Walt Disney World Resort";
  var delayS = 0, fallback = "", timers = [], cfgMap = false;
  function pv(t) { $("pv").textContent = t; }
  // shrink text until it fits in `lines` lines, so nothing runs off the card (line height set here, so the count is exact)
  function fit(el, max, min, lines, LH) {
    el.style.display = ""; el.style.webkitLineClamp = "";
    var size = max;
    var over = function () { el.style.fontSize = size + "px"; el.style.lineHeight = Math.round(size * LH) + "px"; return el.scrollHeight > size * LH * (lines + 0.4); };
    while (over() && size > min) size -= 2;
    if (over()) { el.style.display = "-webkit-box"; el.style.webkitBoxOrient = "vertical"; el.style.webkitLineClamp = String(lines); }
  }
  function refit() { var v = document.documentElement.classList.contains("vertical"); fit($("main"), v ? 76 : 62, 36, 2, 1.05); fit($("sub"), v ? 32 : 27, 20, 1, 1.36); }
  function set(icon, label, main, sub) {
    $("ic").innerHTML = ICON[icon]; $("label").textContent = label; $("main").textContent = main; $("sub").textContent = sub || "";
    refit();
  }
  function render(s, test) {
    var stack = $("stack");
    B.classList.toggle("travel", !!(s && s.travel));
    B.classList.toggle("resort", !!(s && !s.travel && (s.place || s.area === RESORT)));
    stack.classList.remove("empty");
    var has = s && (s.park || s.travel || s.place || s.area || (test && s.outside));
    if (!has) {
      if (preview && !fallback) { set("pin", "Preview", "Nothing on the card yet", "Shows once GPS arrives while you are live"); stack.classList.add("on", "empty"); showHead(); return; }
      if (fallback) { set("pin", "Live from", fallback, ""); stack.classList.add("on"); }
      else stack.classList.remove("on");
      showHead(); return;
    }
    if (s.travel) set("train", "On the way", s.via || "Travelling", s.park || s.place || s.area || "");
    else if (s.ride) set("ride", "", s.ride, [s.land, s.park].filter(Boolean).join(" · "));
    else if (s.land) set("pin", "We're in", s.land, s.park);
    else if (s.park) set("pin", "We're at", s.park, "");
    else if (s.place) set(s.kind === "hotel" ? "hotel" : "pin", "We're at", s.place, s.resort || RESORT);
    else if (s.area) set(s.area === RESORT ? "pin" : "town", s.area === RESORT ? "We're at" : "We're in", s.area, "");
    else set("pin", "Test position", "Outside the parks", "No town name for this spot yet");
    stack.classList.add("on");
    showHead();
  }
  // ---- heading to: what you typed in the app, else your NEXT stop (On stream controls can turn it off) ----
  var headText = "", headOn = true;
  function showHead() {
    $("headtxt").textContent = headText;
    B.classList.toggle("headon", !!(headOn && headText && $("stack").classList.contains("on")));
  }
  function onState(st) {
    st = st || {}; var d = st.display || {}, setg = d.settings || {};
    headOn = setg.heading !== false;
    var typed = typeof st.heading === "string" ? st.heading.trim() : "";
    headText = typed || (d.next && d.next.label ? d.next.label : "");
    showHead();
    // countdown: same rules as the Now scene (state older than 12 hours = yesterday's stream, ignored)
    var fresh = st.updated && (Date.now() - Number(st.updated)) < 12 * 3600 * 1000;
    cdOn = setg.countdown !== false; cdWithin = (Number(setg.within) || 180) * 60; cdTz = d.tz || null;
    cdShows = fresh ? (d.shows || []).filter(function (x) { return x && x.time && x.label; }) : [];
    cdTick();
  }
  // ---- top countdown (copy of overlay.html's): the next ticked show, shown from "within" minutes before until 30 minutes after it starts
  var cdOn = false, cdWithin = 180 * 60, cdTz = null, cdShows = [], LIVE_FOR = 30 * 60;
  function secondsNow(tz) {
    var parts = new Intl.DateTimeFormat("en-US", { timeZone: tz || undefined, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }).formatToParts(new Date());
    var g = function (t) { return Number(parts.find(function (p) { return p.type === t; }).value); };
    return g("hour") * 3600 + g("minute") * 60 + g("second");
  }
  function toSec(hhmm) { var a = String(hhmm).split(":").map(Number); return a[0] * 3600 + (a[1] || 0) * 60; }
  function fmtLeft(s) {
    s = Math.max(0, Math.round(s)); var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    if (h) return h + "<small>h</small> " + m + "<small>m</small>";
    if (m) return m + "<small>m</small> " + String(sec).padStart(2, "0") + "<small>s</small>";
    return sec + "<small>s</small>";
  }
  function cdTick() {
    var cd = $("cd");
    if (!cdOn || !cdShows.length) { cd.classList.remove("show"); return; }
    var now = secondsNow(cdTz);
    var at = function (x) { var v = toSec(x); if (v < 4 * 3600 && now > 18 * 3600) v += 86400; return v; };   // 12-4 AM counts as tonight
    var show = cdShows.slice().sort(function (a, b) { return at(a.time) - at(b.time); }).find(function (i) { return at(i.time) + LIVE_FOR > now; });
    if (!show) { cd.classList.remove("show"); return; }
    var left = at(show.time) - now;
    if (left > cdWithin) { cd.classList.remove("show"); return; }
    cd.classList.add("show");
    $("cdLabel").textContent = left > 0 ? show.label + " starts in" : show.label;
    cd.classList.toggle("final", left > 0 && left <= 60);
    cd.classList.toggle("live", left <= 0);
    $("cdTime").innerHTML = left > 0 ? fmtLeft(left) : "HAPPENING NOW";
  }
  setInterval(cdTick, 1000);
  // ---- round map (owner switch). Exact spot, sent only while the card may show. U.S. government maps (USGS), public domain:
  // "photo" = satellite, "map" = drawn map. Your own nearby ride names are added as labels so viewers know where it is.
  var map = null, dot = null, base = null, baseStyle = "", labels = null, mapStyle = "photo";
  var USGS = { photo: "USGSImageryOnly", map: "USGSTopo" };
  function usgsLayer(style) {
    var svc = USGS[style] || USGS.photo, W = 20037508.342789244;
    var Lyr = L.TileLayer.extend({ getTileUrl: function (c) {
      var size = 2 * W / Math.pow(2, c.z), minx = -W + c.x * size, maxy = W - c.y * size;
      return "https://basemap.nationalmap.gov/arcgis/rest/services/" + svc + "/MapServer/export?bbox=" + [minx, maxy - size, minx + size, maxy].join(",") + "&bboxSR=3857&imageSR=3857&size=256,256&format=jpg&f=image";
    } });
    return new Lyr("", { maxZoom: 19, tileSize: 256 });
  }
  function mapShow(m) {
    if (!cfgMap || !m || m.off || !window.L) { if (B.classList.contains("mapon")) { B.classList.remove("mapon"); refit(); } return; }
    var ll = [m.lat, m.lon];
    if (!B.classList.contains("mapon")) { B.classList.add("mapon"); refit(); }
    B.classList.toggle("photo", mapStyle !== "map");
    if (!map) {
      map = L.map("map", { zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false }).setView(ll, 17);
      labels = L.layerGroup().addTo(map);
      dot = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [26, 26], iconAnchor: [13, 13] }), interactive: false, zIndexOffset: 1000 }).addTo(map);
    } else { dot.setLatLng(ll); map.panTo(ll, { animate: true, duration: .8 }); }
    if (baseStyle !== mapStyle) { if (base) map.removeLayer(base); base = usgsLayer(mapStyle).addTo(map); baseStyle = mapStyle; }
    labels.clearLayers();
    var k = Math.cos(m.lat * Math.PI / 180);
    (m.labels || []).forEach(function (x) {
      var pos = [m.lat + x.dy / 111320, m.lon + x.dx / (111320 * k)];
      labels.addLayer(L.marker(pos, { icon: L.divIcon({ className: "", html: '<span class="lbl"></span>', iconSize: [0, 0] }), interactive: false }));
      var el = labels.getLayers().slice(-1)[0].getElement(); if (el) el.querySelector(".lbl").textContent = x.n;
    });
    setTimeout(function () { if (map) map.invalidateSize(); }, 50);
  }
  var SRC = { phone: "phone GPS", map: "map tap", moblin: "Moblin GPS" };
  function onLoc(m) {
    if (m.cfg) {
      delayS = Math.max(0, Math.min(300, Number(m.cfg.delayS) || 0)); fallback = m.cfg.fallback || "";
      cfgMap = !!m.cfg.map; if (m.cfg.mapColor) document.documentElement.style.setProperty("--ring", m.cfg.mapColor);
      mapStyle = m.cfg.mapStyle === "map" ? "map" : "photo";
      if (!cfgMap) B.classList.remove("mapon");
    }
    if (preview && testing && !m.on) return;
    if (preview) pv(m.on ? "LIVE: this is what viewers see" : "Not live: GPS not used yet");
    // test data (only sent while OBS is not streaming) carries a TEST tag that says where the position came from
    var show = m.on || m.test ? m.show : null, isTest = !!m.test;
    var paint = function () {
      $("testtag").textContent = "TEST" + (m.testSrc && SRC[m.testSrc] ? " · " + SRC[m.testSrc] : "");
      B.classList.toggle("test", isTest && !!show); render(show, isTest);
    };
    if (!delayS || preview) return paint();
    timers.push(setTimeout(function () { timers.shift(); paint(); }, delayS * 1000));
  }
  // preview only: in test mode the card shows what viewers WOULD see
  var testing = false;
  function onCheck(m) {
    testing = !!(m.test && !m.on);
    if (!testing) return;
    pv("TEST · " + (SRC[m.src] || "waiting for GPS") + " · OBS shows it only while not streaming");
    $("testtag").textContent = "TEST" + (SRC[m.src] ? " · " + SRC[m.src] : "");
    B.classList.toggle("test", !!m.show);
    render(m.show, true);
  }
  function fetchState() {
    fetch("/api/state?key=" + encodeURIComponent(key), { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (st) { if (st) onState(st); }).catch(function () {});
  }
  var ws, ping, wait = 2000, stopped = false;
  function connect() {
    if (stopped) return;
    if (!key) { pv("No key in the link"); return; }
    try { ws = new WebSocket(location.origin.replace(/^http/, "ws") + "/api/ws?key=" + encodeURIComponent(key)); }
    catch (e) { return setTimeout(connect, wait); }
    ws.onopen = function () { wait = 2000; pv("Connected · waiting for GPS"); fetchState(); clearInterval(ping); ping = setInterval(function () { try { ws.send("ping"); } catch (e) {} }, 25000); };
    ws.onmessage = function (e) {
      if (e.data === "pong") return; var m; try { m = JSON.parse(e.data); } catch (x) { return; }
      if (!m) return;
      if (m.type === "loc") onLoc(m);
      else if (m.type === "locMap") mapShow(m);
      else if (m.type === "state") onState(m.state);
      else if (m.type === "locCheck" && preview) onCheck(m);
    };
    ws.onclose = function (e) { clearInterval(ping); if (e.code === 4001) { stopped = true; pv("Signed out"); return; } pv("Reconnecting…"); setTimeout(connect, wait); wait = Math.min(wait * 2, 30000); };
    ws.onerror = function () { try { ws.close(); } catch (x) {} };
  }
  // fonts change the text width: fit again once they have loaded
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { if ($("main").textContent) refit(); });
  connect();
})();
</script>
</body></html>
