<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>CTPG Now / Next</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap">
<style>
  /* Cruise & Theme Park Guide overlay. Canvas: 1920x1080, transparent. */
  :root{
    --teal:#1FB8B4; --teal-dark:#0E7F7C; --navy:#0B1E2E; --sun:#FFC933; --pink:#FF4F9A; --violet:#7A3CF0; --white:#FFFFFF;
    --display:"Lilita One","Arial Black",Impact,sans-serif;
    --body:"Nunito","Segoe UI",Arial,sans-serif;
  }
  html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden}
  *{box-sizing:border-box}

  /* ---------- NOW / NEXT CARD (bottom left) ---------- */
  #card{position:absolute;left:40px;bottom:44px;min-width:560px;max-width:900px;
    background:linear-gradient(135deg,rgba(11,30,46,.92),rgba(11,30,46,.82));
    border:5px solid var(--teal);border-radius:26px;padding:18px 26px 20px 22px;
    box-shadow:0 10px 30px rgba(0,0,0,.45),0 0 0 3px rgba(255,255,255,.12) inset;
    display:grid;grid-template-columns:auto 1fr;column-gap:16px;row-gap:12px;align-items:center;
    transform:translateX(-120%);animation:slideIn .9s cubic-bezier(.2,1.3,.4,1) .2s forwards;overflow:hidden}
  @keyframes slideIn{to{transform:translateX(0)}}
  #card::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.22) 45%,transparent 60%);
    transform:translateX(-120%);animation:shine 14s ease-in-out 2s infinite}
  @keyframes shine{0%,85%{transform:translateX(-120%)}100%{transform:translateX(120%)}}

  .chip{font-family:var(--display);font-size:30px;letter-spacing:.04em;padding:6px 16px 4px;border-radius:12px;line-height:1;text-align:center;min-width:112px}
  .chip.now{background:var(--teal);color:var(--white);text-shadow:0 2px 0 var(--teal-dark);display:flex;align-items:center;gap:10px;justify-content:center}
  .chip.next{background:var(--sun);color:var(--navy)}
  .dot{width:14px;height:14px;border-radius:50%;background:#FF3B3B;box-shadow:0 0 0 0 rgba(255,59,59,.8);animation:pulse 1.6s infinite}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,59,.8)}70%{box-shadow:0 0 0 12px rgba(255,59,59,0)}100%{box-shadow:0 0 0 0 rgba(255,59,59,0)}}

  .val{font-family:var(--display);color:var(--white);line-height:1.05;
    -webkit-text-stroke:2px #06121c;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.35);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #now{font-size:58px}
  #nowSub{grid-column:2;margin-top:-10px;font-family:var(--body);font-weight:900;font-size:24px;color:#BDEFEC;letter-spacing:.02em}
  #next{font-size:40px}
  #next .t{color:var(--sun)}
  .swap{animation:flip .6s ease}
  @keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:rotateX(0);opacity:1}}
  .hidden{display:none!important}

  /* ---------- COUNTDOWN (top right) ---------- */
  #cd{position:absolute;right:44px;top:40px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;
    transform:translateY(-160%);transition:transform .8s cubic-bezier(.2,1.3,.4,1)}
  #cd.show{transform:translateY(0)}
  #cd:not(.show){visibility:hidden;transition:transform .8s cubic-bezier(.2,1.3,.4,1),visibility 0s .8s}
  #cdLabel{font-family:var(--display);font-size:32px;color:var(--white);background:var(--violet);
    padding:8px 18px 6px;border-radius:14px;border:4px solid var(--white);-webkit-text-stroke:1px #2a0d5e;paint-order:stroke fill;
    box-shadow:0 6px 18px rgba(0,0,0,.4);max-width:760px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #cdTime{font-family:var(--display);font-size:96px;line-height:1;color:var(--white);
    background:linear-gradient(135deg,var(--pink),var(--violet));padding:10px 28px 4px;border-radius:22px;border:5px solid var(--teal);
    -webkit-text-stroke:3px #2a0d5e;paint-order:stroke fill;font-variant-numeric:tabular-nums;box-shadow:0 10px 30px rgba(0,0,0,.45)}
  #cdTime small{font-size:40px;margin-left:6px}
  #cd.final #cdTime{animation:beat 1s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  #cd.live #cdTime{background:linear-gradient(135deg,#FF8A00,var(--pink));font-size:72px;padding:14px 28px 8px}

  #sparkles{position:absolute;inset:0;pointer-events:none}

  /* ---------- VERTICAL CANVAS (1080x1920): overlay.html?layout=vertical ---------- */
  html.vertical,html.vertical body{width:1080px;height:1920px}
  html.vertical #card{left:36px;right:36px;bottom:330px;min-width:0;max-width:none}
  html.vertical #now{font-size:62px}
  html.vertical #next{font-size:42px}
  html.vertical #cd{right:36px;left:36px;top:250px;align-items:center}
  html.vertical #cdLabel{max-width:1000px;font-size:36px}
  html.vertical #cdTime{font-size:110px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#card{transform:none}}
</style>
</head>
<body>
  <div id="card">
    <div class="chip now"><span class="dot"></span>NOW</div>
    <div class="val" id="now">Live at the parks</div>
    <div id="nowSub"></div>
    <div class="chip next" id="nextChip">NEXT</div>
    <div class="val" id="next"></div>
  </div>

  <div id="cd">
    <div id="cdLabel"></div>
    <div id="cdTime">--:--</div>
  </div>
  <canvas id="sparkles" width="1920" height="1080"></canvas>

<script>
/*
  URL options (add after overlay.html?):
    now=Riding            text for the NOW line (required per scene)
    sub=Space Mountain    optional small line under NOW
    card=0                hide the Now/Next card (countdown only)
    cd=0                  hide the countdown
    within=180            show the countdown when a show is this many minutes away (default 180)
    park=EPCOT            which park's live show times to use (default: park in plan.js)
    party=1               include party-only shows (Halloween / Christmas party nights)
    layout=vertical       1080x1920 layout for the Aitum Vertical canvas
    demo=1                fake times for testing
    state=1               LIVE MODE: one overlay in the live scene. NOW comes from now_state.js,
                          written by Streamer.bot when you tap a "Now:" button scene in Moblin.
                          The park for NEXT comes from your stream title (Streamer.bot), then plan.js.
  Your own stops come from plan.js. Parade and fireworks times come live from ThemeParks.wiki.
*/
const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
const VERTICAL = q.get('layout') === 'vertical';
if (VERTICAL){ document.documentElement.classList.add('vertical'); document.getElementById('sparkles').width = 1080; document.getElementById('sparkles').height = 1920; }
const STATE = q.get('state') === '1';
let NOW_TEXT = q.get('now') || 'Live at the parks';
let statePark = '', stateSeen = '';
const STALE_MS = 8 * 3600 * 1000; // ignore a NOW older than 8 hours (yesterday's stream)
const SHOW_CARD = q.get('card') !== '0';
const SHOW_CD = q.get('cd') !== '0';
const WITHIN = Number(q.get('within') || 180) * 60;
const LIVE_FOR = 15 * 60; // "happening now" lasts 15 minutes

$('now').textContent = NOW_TEXT;
if (!SHOW_CARD) $('card').classList.add('hidden');

// LIVE MODE: read now_state.js every second (Streamer.bot rewrites it on each button tap)
function loadState(){
  const s = document.createElement('script');
  s.src = 'now_state.js?t=' + Date.now();
  s.onload = () => { s.remove(); applyState(window.CTPG_NOW || {}); };
  s.onerror = () => s.remove();
  document.head.appendChild(s);
}
function applyState(st){
  const fresh = st.since && (Date.now() - Number(st.since)) < STALE_MS;
  const nowText = fresh ? String(st.now || '').trim() : '';
  const park = String(st.park || '').trim();
  if (park !== statePark){ statePark = park; loadShows(); }
  const key = nowText + '|' + statePark;
  if (key === stateSeen) return;
  stateSeen = key; NOW_TEXT = nowText;
  $('now').textContent = nowText;
  $('now').classList.remove('swap'); void $('now').offsetWidth; $('now').classList.add('swap');
  document.querySelector('.chip.now').classList.toggle('hidden', !nowText);
  $('now').classList.toggle('hidden', !nowText);
  tick();
}

let plan = window.CTPG_PLAN || null;

// Reload plan.js every 30 s so edits show up without touching OBS.
function loadPlan(){
  const s = document.createElement('script');
  s.src = 'plan.js?t=' + Date.now();
  s.onload = () => { plan = window.CTPG_PLAN || plan; s.remove(); tick(); };
  s.onerror = () => s.remove();
  document.head.appendChild(s);
}

// Current wall-clock time in the plan's time zone, as seconds since local midnight.
function secondsNow(tz){
  const d = q.get('demo') ? new Date(Date.now() + demoOffset) : new Date();
  const parts = new Intl.DateTimeFormat('en-US',{timeZone:tz||undefined,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(d);
  const g = t => Number(parts.find(p => p.type === t).value);
  return g('hour')*3600 + g('minute')*60 + g('second');
}
function toSec(hhmm){ const [h,m] = String(hhmm).split(':').map(Number); return h*3600 + (m||0)*60; }
function fmtClock(hhmm){
  let [h,m] = String(hhmm).split(':').map(Number); const ap = h >= 12 ? 'PM' : 'AM'; h = h % 12 || 12;
  return h + ':' + String(m||0).padStart(2,'0') + ' ' + ap;
}
function fmtLeft(s){
  s = Math.max(0, Math.round(s)); const h = Math.floor(s/3600), m = Math.floor(s%3600/60), sec = s%60;
  return h ? `${h}:${String(m).padStart(2,'0')}<small>:${String(sec).padStart(2,'0')}</small>` : `${m}:${String(sec).padStart(2,'0')}`;
}

let lastNext = '', lastCd = '', burstDone = {};
let demoOffset = 0;
if (q.get('demo')) { // pretend it is 2 min 10 s before the first show in the plan
  setTimeout(() => {
    const show = (plan && plan.items || []).find(i => i.show);
    if (show) demoOffset = (toSec(show.time) - 130 - secondsNow(plan.timezone)) * 1000;
  }, 50);
}

// Live show times from ThemeParks.wiki (see parkdata.js). Refreshed every 5 minutes.
let apiShows = [], apiTz = null;
async function loadShows(){
  try {
    const P = window.CTPG_PARKDATA; if (!P) return;
    const park = q.get('park') || statePark || (plan && plan.park);
    const r = await P.fetchShows(park, { party: q.get('party') === '1' || !!(plan && plan.party), watch: plan && plan.watch, skip: plan && plan.skip, onlyWatch: !!(plan && plan.onlyWatch) });
    if (r.ok){ apiShows = r.shows; apiTz = r.tz; }
    tick();
  } catch (e) { /* offline: keep the last good list */ }
}

function tick(){
  const clean = list => (Array.isArray(list) ? list : []).filter(i => i && i.time && i.label);
  const mine = clean(plan && plan.items);
  const items = mine.concat(apiShows).sort((a,b) => toSec(a.time) - toSec(b.time));
  if (STATE) $('card').classList.toggle('hidden', !SHOW_CARD || (!NOW_TEXT && !items.length));
  if (!items.length) { $('next').textContent = ''; lastNext = ''; $('nextChip').classList.add('hidden'); $('cd').classList.remove('show'); return; }
  const now = secondsNow((plan && plan.timezone) || apiTz);
  $('nowSub').textContent = q.get('sub') || q.get('park') || statePark || (plan && plan.park) || '';

  // NEXT = your next plan stop; if your plan is empty or finished, the next big show from the park
  const ahead = list => list.filter(i => toSec(i.time) > now && i.label.toLowerCase() !== String(NOW_TEXT).toLowerCase());
  const nx = ahead(mine.slice().sort((a,b) => toSec(a.time) - toSec(b.time)))[0] || ahead(items)[0];
  const nextHtml = nx ? `<span class="t">${fmtClock(nx.time)}</span> ${escapeHtml(nx.label)}` : '';
  $('next').style.fontSize = nx && nx.label.length > 26 ? '34px' : '';
  if (nextHtml !== lastNext){
    $('next').innerHTML = nextHtml; $('next').classList.remove('swap'); void $('next').offsetWidth; $('next').classList.add('swap');
    $('nextChip').classList.toggle('hidden', !nx); lastNext = nextHtml;
  }

  // COUNTDOWN = next show within the window, or one that started under 15 min ago
  const cd = $('cd');
  if (!SHOW_CD){ cd.classList.remove('show'); return; }
  const show = items.filter(i => i.show).find(i => toSec(i.time) + LIVE_FOR > now);
  if (!show){ cd.classList.remove('show'); return; }
  const left = toSec(show.time) - now;
  if (left > WITHIN){ cd.classList.remove('show'); return; }
  cd.classList.add('show');
  $('cdLabel').textContent = left > 0 ? `${show.label} starts in` : `${show.label}`;
  cd.classList.toggle('final', left > 0 && left <= 60);
  cd.classList.toggle('live', left <= 0);
  $('cdTime').innerHTML = left > 0 ? fmtLeft(left) : 'HAPPENING NOW';
  if (left <= 0 && !burstDone[show.label + show.time]){ burstDone[show.label + show.time] = true; burst(); }
}
function escapeHtml(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

// Sparkle burst when a show starts (lightweight canvas, about 3 seconds)
function burst(){
  const c = $('sparkles'), x = c.getContext('2d'); const cols = ['#FFC933','#FF4F9A','#1FB8B4','#FFFFFF','#7A3CF0'];
  const r = $('cdTime').getBoundingClientRect(); const ox = r.left + r.width/2, oy = r.top + r.height/2;
  const ps = Array.from({length:140}, () => { const a = Math.random()*Math.PI*2, v = 4 + Math.random()*10;
    return {x:ox, y:oy, vx:Math.cos(a)*v, vy:Math.sin(a)*v - 3, s:3 + Math.random()*5, c:cols[Math.floor(Math.random()*cols.length)], life:1}; });
  (function frame(){
    x.clearRect(0,0,c.width,c.height); let alive = false;
    for (const p of ps){ if (p.life <= 0) continue; alive = true;
      p.x += p.vx; p.y += p.vy; p.vy += .25; p.vx *= .98; p.life -= .012;
      x.globalAlpha = Math.max(0,p.life); x.fillStyle = p.c; x.save(); x.translate(p.x,p.y); x.rotate(p.life*6);
      x.fillRect(-p.s/2,-p.s/2,p.s,p.s); x.restore(); }
    if (alive) requestAnimationFrame(frame); else x.clearRect(0,0,c.width,c.height);
  })();
}

tick();
setInterval(tick, 1000);
setInterval(loadPlan, 30000);
if (STATE){ applyState({}); loadState(); setInterval(loadState, 1000); }
</script>
<script src="plan.js"></script>
<script src="parkdata.js"></script>
<script>plan = window.CTPG_PLAN || plan; tick(); loadShows(); setInterval(loadShows, 5 * 60 * 1000);</script>
</body>
</html>
