<!doctype html><meta charset="utf-8">
<style>html,body{margin:0;overflow:hidden}body{width:var(--w);height:var(--h);position:relative;background:#000}
img,iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}</style>
<script>const q=new URLSearchParams(location.search);const v=q.get('v')==='1';document.documentElement.style.setProperty('--w',v?'1080px':'1920px');document.documentElement.style.setProperty('--h',v?'1920px':'1080px');</script>
<body><img id="bg"><iframe id="ov" allowtransparency="true" style="background:transparent"></iframe>
<script>document.getElementById('bg').src=v?'../offline-monorail-tall.jpg':'../offline-monorail-wide.jpg';document.getElementById('ov').src='overlay.html?state=1'+(v?'&layout=vertical':'');</script>
