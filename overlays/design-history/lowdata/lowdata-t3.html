<!doctype html>
<html><head><meta charset="utf-8">
<title>Low Data Badge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap">
<!-- CTPG low-data badge. OBS browser source, 1920x1080 (or 1080x1920 with ?layout=vertical).
     Link settings: ?layout=vertical  ?msg=Your%20text  ?pos=top (default bottom-left)  ?size=0.6 (default; 1 = original)  ?style=bug|tag|stub|sticker (compact designs)  ?asize=1 (their size)  ?previewbg=image.jpg (testing) -->
<style>
  :root{
    --teal:#1FB8B4; --teal-dark:#0E7F7C; --navy:#0B1E2E; --navy2:#12314A; --sun:#FFC933; --pink:#FF4F9A; --violet:#7A3CF0; --white:#FFFFFF; --mint:#BDEFEC;
    --display:"Lilita One","Arial Black",Impact,sans-serif; --body:"Nunito","Segoe UI",Arial,sans-serif;
  }
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
  html.vertical,html.vertical body{width:1080px;height:1920px}
  body{background-size:cover;background-position:center}

  #badge{position:absolute;left:44px;bottom:56px;zoom:var(--size,.6);display:flex;align-items:center;gap:22px;
    padding:16px 34px 16px 18px;border-radius:30px;background:linear-gradient(135deg,var(--navy2),var(--navy));
    border:5px solid var(--sun);box-shadow:0 12px 34px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.08);
    transform:translateY(160%);animation:slideIn .9s cubic-bezier(.2,1.3,.4,1) .2s forwards;overflow:hidden}
  html.pos-top #badge{bottom:auto;top:40px;transform:translateY(-160%)}
  html.vertical #badge{left:50%;bottom:330px;translate:-50% 0;zoom:var(--size,.7)}
  html.vertical.pos-top #badge{top:520px;bottom:auto}
  @keyframes slideIn{to{transform:translateY(0)}}

  /* shine sweep every 6 s */
  #badge::after{content:"";position:absolute;top:0;bottom:0;width:120px;left:-160px;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);animation:shine 6s ease-in-out 1.4s infinite}
  @keyframes shine{0%{left:-160px}22%,100%{left:110%}}

  /* round sticker with the signal icon */
  .sticker{position:relative;width:118px;height:118px;flex:none;border-radius:50%;background:var(--sun);
    display:grid;place-items:center;box-shadow:0 5px 0 #c9960f, 0 8px 18px rgba(0,0,0,.35)}
  .ring{position:absolute;inset:-9px;border-radius:50%;border:5px dashed var(--pink);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  svg{width:78px;height:78px;overflow:visible}
  .arc{fill:none;stroke:var(--navy);stroke-width:9;stroke-linecap:round}
  .dot{fill:var(--navy)}
  /* arcs light up in order, the outer one drops out: a weak-but-alive signal */
  .a1{animation:a1 2.4s ease-in-out infinite}
  .a2{animation:a2 2.4s ease-in-out infinite}
  .a3{animation:a3 2.4s ease-in-out infinite}
  @keyframes a1{0%,8%{opacity:.18}16%,100%{opacity:1}}
  @keyframes a2{0%,24%{opacity:.18}34%,100%{opacity:1}}
  @keyframes a3{0%,42%{opacity:.18}52%,62%{opacity:1}70%,100%{opacity:.18}}
  .dot{animation:beat 1.2s ease-in-out infinite;transform-origin:50px 82px}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  .txt{display:flex;flex-direction:column;gap:6px;position:relative}
  .title{font-family:var(--display);font-size:58px;line-height:.95;color:var(--sun);letter-spacing:.02em;
    -webkit-text-stroke:2px #06121c;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.35);white-space:nowrap}
  .title span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .title span:nth-child(2){animation-delay:.12s}.title span:nth-child(3){animation-delay:.24s}
  @keyframes bob{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-6px)}}
  .msg{font-family:var(--body);font-weight:900;font-size:27px;color:var(--mint);white-space:nowrap;display:flex;align-items:center;gap:10px}
  .live{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;letter-spacing:.06em;color:var(--white);
    background:var(--pink);padding:4px 12px 2px;border-radius:10px}
  .live i{width:11px;height:11px;border-radius:50%;background:var(--white);animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}

  html.vertical .title{font-size:64px} html.vertical .msg{font-size:29px}


  /* ===== Compact alternatives: ?style=bug | tag | stub | sticker  (default = the card above) ===== */
  .alt{display:none;position:absolute;left:44px;bottom:56px;font-family:var(--display);zoom:var(--asize,1)}
  html.vertical .alt{left:50%;bottom:330px;translate:-50% 0}
  html.pos-top .alt{bottom:auto;top:40px}
  html[data-style] #badge{display:none}
  html[data-style="bug"] #bug, html[data-style="tag"] #tag, html[data-style="stub"] #stub, html[data-style="sticker"] #stk{display:flex}
  .alt{animation:pop .7s cubic-bezier(.2,1.4,.4,1) .2s both}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
  /* signal bars (cell style): bars fill in turn, the tallest drops out */
  .bars{display:flex;align-items:flex-end;gap:5px;height:44px}
  .bars b{width:10px;border-radius:3px;background:currentColor;opacity:.2;animation:bar 2.4s ease-in-out infinite}
  .bars b:nth-child(1){height:30%;animation-name:b1}.bars b:nth-child(2){height:55%;animation-name:b2}
  .bars b:nth-child(3){height:80%;animation-name:b3}.bars b:nth-child(4){height:100%;animation-name:b4}
  @keyframes b1{0%,8%{opacity:.2}14%,100%{opacity:1}}
  @keyframes b2{0%,22%{opacity:.2}30%,100%{opacity:1}}
  @keyframes b3{0%,38%{opacity:.2}46%,64%{opacity:1}72%,100%{opacity:.2}}
  @keyframes b4{0%,100%{opacity:.2}}
  .dotlive{width:12px;height:12px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 0 rgba(255,79,154,.7);animation:ping 1.6s ease-out infinite}
  @keyframes ping{0%{box-shadow:0 0 0 0 rgba(255,79,154,.7)}80%,100%{box-shadow:0 0 0 12px rgba(255,79,154,0)}}

  /* A. bug: small square like a TV network bug */
  #bug{flex-direction:column;align-items:center;gap:6px;width:118px;padding:14px 0 10px;border-radius:22px;
    background:linear-gradient(160deg,var(--navy2),var(--navy));border:4px solid var(--sun);color:var(--sun);box-shadow:0 8px 22px rgba(0,0,0,.45)}
  #bug .lbl{font-size:24px;line-height:.9;text-align:center;letter-spacing:.03em;-webkit-text-stroke:1px #06121c;paint-order:stroke fill}
  #bug .lv{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mint);letter-spacing:.08em}
  #bug .dotlive{width:9px;height:9px}

  /* B. tag: one slim line */
  #tag{align-items:center;gap:12px;padding:8px 18px 8px 12px;border-radius:999px;background:var(--navy);border:3px solid var(--sun);
    color:var(--sun);box-shadow:0 6px 16px rgba(0,0,0,.45)}
  #tag .bars{height:28px;gap:3px} #tag .bars b{width:6px}
  #tag .lbl{font-size:28px;line-height:1;letter-spacing:.03em;padding-top:3px}
  #tag .sep{width:2px;height:24px;background:rgba(255,255,255,.2)}
  #tag .lv{display:flex;align-items:center;gap:7px;font-size:18px;color:var(--mint);letter-spacing:.06em;padding-top:2px}

  /* C. stub: a small park ticket stub, gold, with a perforated edge */
  #stub{align-items:stretch;border-radius:14px;overflow:hidden;box-shadow:0 8px 20px rgba(0,0,0,.45);color:var(--navy)}
  #stub .l{display:grid;place-items:center;padding:0 14px;background:var(--pink);color:var(--white);position:relative}
  #stub .l::after{content:"";position:absolute;right:-5px;top:0;bottom:0;width:10px;
    background:radial-gradient(circle at 5px 8px,var(--sun) 3.5px,transparent 4px) 0 0/10px 16px}
  #stub .bars{height:36px;gap:4px} #stub .bars b{width:7px}
  #stub .r{background:var(--sun);padding:8px 16px 7px 18px;display:flex;flex-direction:column;justify-content:center}
  #stub .lbl{font-size:30px;line-height:.95;letter-spacing:.02em}
  #stub .lv{display:flex;align-items:center;gap:6px;font-family:var(--body);font-weight:900;font-size:15px;letter-spacing:.06em;color:#6b2d4a}
  #stub .dotlive{width:9px;height:9px;background:#d61f6f}

  /* D. sticker: just the round sticker, words curve around it */
  #stk{width:150px;height:150px;position:absolute}
  #stk .disc{position:absolute;inset:22px;border-radius:50%;background:var(--sun);display:grid;place-items:center;box-shadow:0 5px 0 #c9960f,0 8px 18px rgba(0,0,0,.4)}
  #stk .disc svg{width:62px;height:62px}
  #stk .orbit{position:absolute;inset:0;animation:spin 14s linear infinite}
  #stk .orbit text{font-family:var(--display);font-size:17px;letter-spacing:2.2px;fill:var(--white);stroke:#06121c;stroke-width:3px;paint-order:stroke fill}
  #stk .live2{position:absolute;left:50%;bottom:4px;translate:-50% 0;display:flex;align-items:center;gap:6px;background:var(--pink);color:var(--white);
    font-size:15px;letter-spacing:.06em;padding:3px 10px 2px;border-radius:8px;border:2px solid var(--white)}
  #stk .live2 i{width:8px;height:8px;border-radius:50%;background:var(--white);animation:blink 1.2s steps(2) infinite}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}#badge{transform:none}.a3{opacity:.18}}
</style></head>
<body>
<div id="badge">
  <div class="sticker"><div class="ring"></div>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path class="arc a3" d="M10 44 A56 56 0 0 1 90 44"/>
      <path class="arc a2" d="M24 57 A36 36 0 0 1 76 57"/>
      <path class="arc a1" d="M38 70 A17 17 0 0 1 62 70"/>
      <circle class="dot" cx="50" cy="82" r="7"/>
    </svg>
  </div>
  <div class="txt">
    <div class="title"><span>LOW</span> <span>DATA</span> <span>MODE</span></div>
    <div class="msg"><span class="live"><i></i>STILL LIVE</span><span id="msg">Weak signal, hang tight!</span></div>
  </div>
</div>

<div class="alt" id="bug"><div class="bars"><b></b><b></b><b></b><b></b></div><div class="lbl">LOW<br>DATA</div><div class="lv"><span class="dotlive"></span>LIVE</div></div>
<div class="alt" id="tag"><div class="bars"><b></b><b></b><b></b><b></b></div><div class="lbl">LOW DATA</div><div class="sep"></div><div class="lv"><span class="dotlive"></span>STILL LIVE</div></div>
<div class="alt" id="stub"><div class="l"><div class="bars"><b></b><b></b><b></b><b></b></div></div><div class="r"><div class="lbl">LOW DATA</div><div class="lv"><span class="dotlive"></span>STILL LIVE</div></div></div>
<div class="alt" id="stk"><svg class="orbit" viewBox="0 0 150 150"><defs><path id="circ" d="M75 75 m-62 0 a62 62 0 1 1 124 0 a62 62 0 1 1 -124 0"/></defs>
  <text><textPath href="#circ">LOW DATA MODE ★ WEAK SIGNAL ★ LOW DATA MODE ★</textPath></text></svg>
  <div class="disc"><svg viewBox="0 0 100 100"><path class="arc a3" d="M10 44 A56 56 0 0 1 90 44"/><path class="arc a2" d="M24 57 A36 36 0 0 1 76 57"/><path class="arc a1" d="M38 70 A17 17 0 0 1 62 70"/><circle class="dot" cx="50" cy="82" r="7"/></svg></div>
  <div class="live2"><i></i>STILL LIVE</div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('layout') === 'vertical') document.documentElement.classList.add('vertical');
  if (q.get('pos') === 'top') document.documentElement.classList.add('pos-top');
  if (q.get('msg')) document.getElementById('msg').textContent = q.get('msg');
  if (q.get('size')) document.documentElement.style.setProperty('--size', q.get('size'));   // e.g. size=1 for the original big badge
  if (q.get('style')) document.documentElement.dataset.style = q.get('style');   // bug | tag | stub | sticker
  if (q.get('asize')) document.documentElement.style.setProperty('--asize', q.get('asize'));
  if (q.get('previewbg')) document.body.style.backgroundImage = 'url(' + q.get('previewbg') + ')';
</script>
</body></html>
