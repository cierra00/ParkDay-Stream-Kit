<!doctype html>
<html><head><meta charset="utf-8">
<title>Low Signal Tile</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@600;700&display=swap">
<!-- CTPG low-signal tile, in the Cruise & Theme Park Guide brand (navy panel, gold edge, blue glow, Oswald caps).
     OBS browser source 1920x1080, or 1080x1920 with ?layout=vertical.
     Link settings: ?layout=vertical  ?msg=HANG%20TIGHT  ?pos=top  ?size=1.2  ?previewbg=image.jpg (testing only) -->
<style>
  :root{
    --navy:#0A2542; --navy-deep:#041E3B; --gold:#F4AD2B; --gold-hi:#FFC94D; --blue:#0078AE; --glow:#1FA3FF; --white:#FFFFFF;
    --font:"Oswald","Bebas Neue","Arial Narrow",Impact,sans-serif; --size:1;
  }
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
  html.vertical,html.vertical body{width:1080px;height:1920px}
  html.vertical{--size:1.3}
  body{background-size:cover;background-position:center}

  #tile{position:absolute;left:40px;bottom:48px;zoom:var(--size);width:164px;padding:14px 0 13px;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:22px;
    background:radial-gradient(120% 90% at 50% 0%,#12386A 0%,var(--navy) 55%,var(--navy-deep) 100%);
    border:2px solid var(--gold);
    box-shadow:0 0 0 1px rgba(0,0,0,.35),inset 0 0 18px rgba(31,163,255,.28),0 0 16px rgba(0,120,174,.45),0 10px 22px rgba(0,0,0,.45);
    opacity:0;transform:scale(.85);animation:enter .6s cubic-bezier(.2,1.3,.4,1) .2s forwards}
  html.pos-top #tile{bottom:auto;top:40px}
  html.vertical #tile{left:36px;bottom:260px}
  @keyframes enter{to{opacity:1;transform:none}}

  /* loading ring around the signal bars */
  .gauge{position:relative;width:74px;height:74px;display:grid;place-items:center}
  .gauge svg.ring{position:absolute;inset:0;width:74px;height:74px}
  .track{fill:none;stroke:rgba(255,255,255,.12);stroke-width:5}
  .spin{fill:none;stroke:var(--gold);stroke-width:5;stroke-linecap:round;stroke-dasharray:48 160;
    transform-origin:37px 37px;animation:spin 1.3s linear infinite;filter:drop-shadow(0 0 3px rgba(244,173,43,.8))}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* signal bars: two strong, two weak that try to fill and fall back */
  .bars{display:flex;align-items:flex-end;gap:4px;height:30px;margin-top:4px}
  .bars b{width:7px;border-radius:2px;background:var(--white)}
  .bars b:nth-child(1){height:30%}
  .bars b:nth-child(2){height:55%}
  .bars b:nth-child(3){height:78%;background:rgba(255,255,255,.22);animation:try 2.6s ease-in-out infinite}
  .bars b:nth-child(4){height:100%;background:rgba(255,255,255,.22);animation:try 2.6s ease-in-out .35s infinite}
  @keyframes try{0%,55%,100%{background:rgba(255,255,255,.22)}65%,75%{background:var(--gold-hi)}}

  .title{font-family:var(--font);font-weight:700;font-size:25px;line-height:1;letter-spacing:.06em;color:var(--white);
    text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.45)}
  .msg{font-family:var(--font);font-weight:600;font-size:15px;line-height:1;letter-spacing:.14em;color:var(--gold);text-transform:uppercase;
    display:flex;align-items:baseline}
  .dots span{animation:dot 1.4s infinite;opacity:.2}
  .dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,60%,100%{opacity:.2}30%{opacity:1}}

  @media (prefers-reduced-motion:reduce){*{animation:none!important}#tile{opacity:1;transform:none}}
</style></head>
<body>
<div id="tile">
  <div class="gauge">
    <svg class="ring" viewBox="0 0 74 74" aria-hidden="true"><circle class="track" cx="37" cy="37" r="33"/><circle class="spin" cx="37" cy="37" r="33"/></svg>
    <div class="bars"><b></b><b></b><b></b><b></b></div>
  </div>
  <div class="title">Low Signal</div>
  <div class="msg"><span id="msg">Hang tight</span><span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('layout') === 'vertical') document.documentElement.classList.add('vertical');
  if (q.get('pos') === 'top') document.documentElement.classList.add('pos-top');
  if (q.get('msg')) document.getElementById('msg').textContent = q.get('msg');
  if (q.get('size')) document.documentElement.style.setProperty('--size', q.get('size'));
  if (q.get('previewbg')) document.body.style.backgroundImage = 'url(' + q.get('previewbg') + ')';
</script>
</body></html>
