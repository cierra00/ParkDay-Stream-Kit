<!doctype html>
<html><head><meta charset="utf-8">
<title>Low Data Badge</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@800;900&display=swap">
<!-- CTPG low-data badge. OBS browser source, 1920x1080 (or 1080x1920 with ?layout=vertical).
     Link settings: ?layout=vertical  ?msg=Your%20text  ?pos=top (default bottom-left)  ?size=0.6 (default; 1 = original)  ?style=sign|queue|sky (compact designs)  ?asize=1 (their size)  ?previewbg=image.jpg (testing) -->
<style>
  :root{
    --teal:#1FB8B4; --teal-dark:#0E7F7C; --navy:#0B1E2E; --navy2:#12314A; --sun:#FFC933; --pink:#FF4F9A; --violet:#7A3CF0; --white:#FFFFFF; --mint:#BDEFEC;
    --display:"Lilita One","Arial Black",Impact,sans-serif; --body:"Nunito","Segoe UI",Arial,sans-serif;
  }
  html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:transparent}
  html.vertical,html.vertical body{width:1080px;height:1920px}
  body{background-size:cover;background-position:center}

  #badge{position:absolute;left:44px;bottom:56px;zoom:var(--size,.6);display:flex;align-items:center;gap:22px;
    padding:16px 34px 16px 18px;border-radius:30px;background:linear-gradient(135deg,var(--navy2),var(--navy));
    border:5px solid var(--sun);box-shadow:0 12px 34px rgba(0,0,0,.5), inset 0 0 0 2px rgba(255,255,255,.08);
    transform:translateY(160%);animation:slideIn .9s cubic-bezier(.2,1.3,.4,1) .2s forwards;overflow:hidden}
  html.pos-top #badge{bottom:auto;top:40px;transform:translateY(-160%)}
  html.vertical #badge{left:50%;bottom:330px;translate:-50% 0;zoom:var(--size,.7)}
  html.vertical.pos-top #badge{top:520px;bottom:auto}
  @keyframes slideIn{to{transform:translateY(0)}}

  /* shine sweep every 6 s */
  #badge::after{content:"";position:absolute;top:0;bottom:0;width:120px;left:-160px;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.18),transparent);animation:shine 6s ease-in-out 1.4s infinite}
  @keyframes shine{0%{left:-160px}22%,100%{left:110%}}

  /* round sticker with the signal icon */
  .sticker{position:relative;width:118px;height:118px;flex:none;border-radius:50%;background:var(--sun);
    display:grid;place-items:center;box-shadow:0 5px 0 #c9960f, 0 8px 18px rgba(0,0,0,.35)}
  .ring{position:absolute;inset:-9px;border-radius:50%;border:5px dashed var(--pink);animation:spin 9s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  svg{width:78px;height:78px;overflow:visible}
  .arc{fill:none;stroke:var(--navy);stroke-width:9;stroke-linecap:round}
  .dot{fill:var(--navy)}
  /* arcs light up in order, the outer one drops out: a weak-but-alive signal */
  .a1{animation:a1 2.4s ease-in-out infinite}
  .a2{animation:a2 2.4s ease-in-out infinite}
  .a3{animation:a3 2.4s ease-in-out infinite}
  @keyframes a1{0%,8%{opacity:.18}16%,100%{opacity:1}}
  @keyframes a2{0%,24%{opacity:.18}34%,100%{opacity:1}}
  @keyframes a3{0%,42%{opacity:.18}52%,62%{opacity:1}70%,100%{opacity:.18}}
  .dot{animation:beat 1.2s ease-in-out infinite;transform-origin:50px 82px}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}

  .txt{display:flex;flex-direction:column;gap:6px;position:relative}
  .title{font-family:var(--display);font-size:58px;line-height:.95;color:var(--sun);letter-spacing:.02em;
    -webkit-text-stroke:2px #06121c;paint-order:stroke fill;text-shadow:0 4px 0 rgba(0,0,0,.35);white-space:nowrap}
  .title span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
  .title span:nth-child(2){animation-delay:.12s}.title span:nth-child(3){animation-delay:.24s}
  @keyframes bob{0%,80%,100%{transform:translateY(0)}88%{transform:translateY(-6px)}}
  .msg{font-family:var(--body);font-weight:900;font-size:27px;color:var(--mint);white-space:nowrap;display:flex;align-items:center;gap:10px}
  .live{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:22px;letter-spacing:.06em;color:var(--white);
    background:var(--pink);padding:4px 12px 2px;border-radius:10px}
  .live i{width:11px;height:11px;border-radius:50%;background:var(--white);animation:blink 1.2s steps(2) infinite}
  @keyframes blink{50%{opacity:.2}}

  html.vertical .title{font-size:64px} html.vertical .msg{font-size:29px}



  /* ===== Compact designs (round 2): ?style=sign | queue | sky  (default = the small card) ===== */
  .alt{display:none;position:absolute;left:44px;bottom:56px;zoom:var(--asize,1);font-family:var(--display)}
  html.vertical .alt{left:50%;bottom:330px;translate:-50% 0;zoom:var(--asize,1.15)}
  html.pos-top .alt{bottom:auto;top:40px}
  html[data-style] #badge{display:none}
  html[data-style="sign"] #sign, html[data-style="queue"] #queue, html[data-style="sky"] #sky{display:flex}
  .alt{transform:translateY(160%);animation:slideIn .9s cubic-bezier(.2,1.3,.4,1) .2s forwards}
  .card{position:relative;align-items:center;gap:12px;padding:9px 18px 9px 9px;border-radius:20px;
    background:linear-gradient(135deg,var(--navy2),var(--navy));border:4px solid var(--sun);box-shadow:0 8px 22px rgba(0,0,0,.5)}
  .mini{position:relative;width:62px;height:62px;flex:none;border-radius:50%;background:var(--sun);display:grid;place-items:center;
    box-shadow:0 3px 0 #c9960f,0 5px 12px rgba(0,0,0,.35)}
  .mini svg{width:42px;height:42px}
  .t1{font-size:34px;line-height:.9;color:var(--sun);letter-spacing:.02em;-webkit-text-stroke:1.5px #06121c;paint-order:stroke fill;white-space:nowrap}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:15px;letter-spacing:.07em;color:var(--white);background:var(--pink);
    padding:3px 9px 1px;border-radius:7px;white-space:nowrap}
  .pill i{width:8px;height:8px;border-radius:50%;background:var(--white);animation:blink 1.2s steps(2) infinite}
  .col{display:flex;flex-direction:column;gap:5px;align-items:flex-start}
  .alt svg .arc{stroke-width:10}

  /* 1. SIGN: attraction marquee, bulbs chase around the border */
  #sign{padding:12px 20px 12px 12px}
  #sign .bulbs{position:absolute;inset:-4px;border-radius:20px;pointer-events:none}
  #sign .bulbs rect{fill:none;stroke:#FFF3B0;stroke-width:5;stroke-linecap:round;stroke-dasharray:.1 16;animation:chase 1s linear infinite;
    filter:drop-shadow(0 0 3px #FFE27A)}
  @keyframes chase{to{stroke-dashoffset:-16.1}}
  #sign .t1{font-size:36px}
  #sign .mini{animation:tilt 2.4s ease-in-out infinite}
  @keyframes tilt{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

  /* 2. QUEUE: like a posted wait-time board; the tile flips between LOW and DATA */
  #queue .board{display:flex;flex-direction:column;align-items:center;gap:3px}
  #queue .hdr{font-family:var(--body);font-weight:900;font-size:13px;letter-spacing:.14em;color:var(--mint)}
  #queue .tiles{display:flex;gap:4px;perspective:200px}
  #queue .tile{position:relative;width:96px;height:44px;border-radius:8px;background:#F7F1E3;color:var(--navy);font-size:34px;line-height:44px;
    text-align:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);overflow:hidden}
  #queue .tile::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:rgba(11,30,46,.25)}
  #queue .tile span{position:absolute;inset:0;backface-visibility:hidden;animation:flipA 5s ease-in-out infinite}
  #queue .tile span+span{animation-name:flipB}
  @keyframes flipA{0%,40%{transform:rotateX(0)}50%,90%{transform:rotateX(-180deg)}100%{transform:rotateX(-360deg)}}
  @keyframes flipB{0%,40%{transform:rotateX(180deg)}50%,90%{transform:rotateX(0)}100%{transform:rotateX(-180deg)}}

  /* 3. SKY: the sticker is a Skyliner-style cabin swinging on its cable, beaming the signal */
  #sky{padding-left:14px}
  #sky .cab{position:relative;width:70px;height:74px;flex:none}
  #sky .cable{position:absolute;left:-14px;right:-6px;top:6px;height:3px;background:#9fb3c2;border-radius:2px;transform:rotate(-8deg)}
  #sky .pod{position:absolute;left:8px;top:6px;width:54px;transform-origin:27px 0;animation:swing 2.6s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
  #sky .arm{width:3px;height:14px;margin:0 auto;background:#9fb3c2}
  #sky .body{width:54px;height:48px;border-radius:14px 14px 16px 16px;background:var(--sun);display:grid;place-items:center;
    box-shadow:inset 0 -5px 0 #c9960f,0 4px 10px rgba(0,0,0,.35)}
  #sky .body svg{width:36px;height:36px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}#badge{transform:none}.a3{opacity:.18}}
</style></head>
<body>
<div id="badge">
  <div class="sticker"><div class="ring"></div>
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <path class="arc a3" d="M10 44 A56 56 0 0 1 90 44"/>
      <path class="arc a2" d="M24 57 A36 36 0 0 1 76 57"/>
      <path class="arc a1" d="M38 70 A17 17 0 0 1 62 70"/>
      <circle class="dot" cx="50" cy="82" r="7"/>
    </svg>
  </div>
  <div class="txt">
    <div class="title"><span>LOW</span> <span>DATA</span> <span>MODE</span></div>
    <div class="msg"><span class="live"><i></i>STILL LIVE</span><span id="msg">Weak signal, hang tight!</span></div>
  </div>
</div>


<div class="alt card" id="sign"><svg class="bulbs" viewBox="0 0 100 100" preserveAspectRatio="none"><rect x="1.5" y="3" width="97" height="94" rx="9" vector-effect="non-scaling-stroke"/></svg>
  <div class="mini"><svg viewBox="0 0 100 100"><path class="arc a3" d="M10 44 A56 56 0 0 1 90 44"/><path class="arc a2" d="M24 57 A36 36 0 0 1 76 57"/><path class="arc a1" d="M38 70 A17 17 0 0 1 62 70"/><circle class="dot" cx="50" cy="82" r="7"/></svg></div><div class="col"><div class="t1">LOW DATA</div><span class="pill"><i></i>STILL LIVE</span></div></div>
<div class="alt card" id="queue"><div class="mini"><svg viewBox="0 0 100 100"><path class="arc a3" d="M10 44 A56 56 0 0 1 90 44"/><path class="arc a2" d="M24 57 A36 36 0 0 1 76 57"/><path class="arc a1" d="M38 70 A17 17 0 0 1 62 70"/><circle class="dot" cx="50" cy="82" r="7"/></svg></div>
  <div class="board"><div class="hdr">SIGNAL</div><div class="tiles"><div class="tile"><span>LOW</span><span>DATA</span></div></div></div>
  <span class="pill"><i></i>LIVE</span></div>
<div class="alt card" id="sky"><div class="cab"><div class="cable"></div><div class="pod"><div class="arm"></div><div class="body"><svg viewBox="0 0 100 100"><path class="arc a3" d="M10 44 A56 56 0 0 1 90 44"/><path class="arc a2" d="M24 57 A36 36 0 0 1 76 57"/><path class="arc a1" d="M38 70 A17 17 0 0 1 62 70"/><circle class="dot" cx="50" cy="82" r="7"/></svg></div></div></div>
  <div class="col"><div class="t1">LOW DATA</div><span class="pill"><i></i>STILL LIVE</span></div></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('layout') === 'vertical') document.documentElement.classList.add('vertical');
  if (q.get('pos') === 'top') document.documentElement.classList.add('pos-top');
  if (q.get('msg')) document.getElementById('msg').textContent = q.get('msg');
  if (q.get('size')) document.documentElement.style.setProperty('--size', q.get('size'));   // e.g. size=1 for the original big badge
  if (q.get('style')) document.documentElement.dataset.style = q.get('style');   // sign | queue | sky
  if (q.get('asize')) document.documentElement.style.setProperty('--asize', q.get('asize'));
  if (q.get('previewbg')) document.body.style.backgroundImage = 'url(' + q.get('previewbg') + ')';
</script>
</body></html>
